<style>
  :root{--text:#111827;--soft:#6b7280;--bdr:#e7e8e9;--ghost:#f9fafb;--primary:#123c40;--alarm:#ef4444}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#fafafa;font-family:Inter,system-ui,sans-serif;color:var(--text);letter-spacing:.012em}
  body{display:flex;align-items:center;justify-content:center;padding:16px}
  form{width:100%;max-width:360px;background:#fff;border:1px solid var(--bdr);border-radius:16px;padding:32px;display:flex;flex-direction:column;gap:16px;box-shadow:0 8px 24px rgba(17,24,39,.06)}
  h1{margin:0;font:600 20px/28px Inter}
  p{margin:0;color:var(--soft);font:400 14px/20px Inter}
  label{font:500 12px/14px Inter;color:var(--soft);display:flex;flex-direction:column;gap:4px}
  input{height:40px;border-radius:16px;border:1px solid var(--bdr);background:var(--ghost);padding:0 12px;font:400 14px Inter;color:var(--text);outline:0}
  input:focus{border-color:var(--primary)}
  button{height:40px;border:0;border-radius:16px;background:var(--primary);color:#fff;font:500 14px Inter;cursor:pointer}
  button:disabled{opacity:.6;cursor:default}
  .err{color:var(--alarm);font:400 12px/14px Inter;min-height:14px}
</style></head>

async function unlock(pass){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(SALT),iterations:ITER,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);

}
